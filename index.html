<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Studying-Mate · 考研英语 AI 精读助手</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%233B66F5'/%3E%3Cpath d='M9 10.5C9 9.67 9.67 9 10.5 9H15c1.66 0 3 1.34 3 3v11c0-1.1-.9-2-2-2h-5.5A1.5 1.5 0 0 1 9 19.5v-9Z' fill='white' fill-opacity='.95'/%3E%3Cpath d='M23 10.5c0-.83-.67-1.5-1.5-1.5H17c-1.66 0-3 1.34-3 3v11c0-1.1.9-2 2-2h5.5a1.5 1.5 0 0 0 1.5-1.5v-9Z' fill='white' fill-opacity='.72'/%3E%3C/svg%3E" />
    <script>
      (function () {
        try {
          var raw = localStorage.getItem('studying-mate-settings-v1');
          var theme = 'system';
          if (raw) {
            var parsed = JSON.parse(raw);
            theme = (parsed && parsed.state && parsed.state.theme) || 'system';
          }
          var isDark =
            theme === 'dark' ||
            (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="antialiased selection:bg-accent/20 selection:text-text-primary">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
